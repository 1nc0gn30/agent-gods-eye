[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gods-eye"
version = "1.0.0"
description = "Autonomous zero-dependency Shodan OSINT tactical radar and 3D planetary intelligence cockpit"
authors = [{ name = "Neal Frazier Tech", email = "neal@nealfrazier.tech" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-gods-eye = "agent_gods_eye.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
