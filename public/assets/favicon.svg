<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#08080B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Dark Backing -->
  <circle cx="50" cy="50" r="48" fill="#08080B" stroke="#222533" stroke-width="2"/>
  
  <!-- Planetary Coordinate Rings -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="2 4" opacity="0.8"/>
  <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>
  <ellipse cx="50" cy="50" rx="16" ry="42" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  
  <!-- Glow Core -->
  <circle cx="50" cy="50" r="22" fill="url(#eyeGlow)"/>
  
  <!-- Eye Almond Contour -->
  <path d="M 16 50 Q 50 18 84 50 Q 50 82 16 50 Z" fill="none" stroke="url(#goldRing)" stroke-width="2.5"/>
  
  <!-- Iris & Pupil -->
  <circle cx="50" cy="50" r="14" fill="#0E121B" stroke="#06B6D4" stroke-width="2"/>
  <circle cx="50" cy="50" r="7" fill="#06B6D4"/>
  <circle cx="48" cy="48" r="2.5" fill="#FFFFFF"/>
  
  <!-- Tactical Reticle Crosshairs -->
  <line x1="50" y1="4" x2="50" y2="16" stroke="#D4AF37" stroke-width="2"/>
  <line x1="50" y1="84" x2="50" y2="96" stroke="#D4AF37" stroke-width="2"/>
  <line x1="4" y1="50" x2="16" y2="50" stroke="#D4AF37" stroke-width="2"/>
  <line x1="84" y1="50" x2="96" y2="50" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Corner Targeting Brackets -->
  <path d="M 22 28 L 22 22 L 28 22" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
  <path d="M 78 28 L 78 22 L 72 22" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
  <path d="M 22 72 L 22 78 L 28 78" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
  <path d="M 78 72 L 78 78 L 72 78" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
</svg>
